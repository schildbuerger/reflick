[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflick"
version = "0.1.0"
description = "Aggregates revival screenings from Berlin cinemas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reflick = "reflick.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reflick"]

[tool.pytest.ini_options]
testpaths = ["tests"]
