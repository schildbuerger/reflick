[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflick"
version = "0.1.0"
description = "Aggregates revival screenings from Berlin cinemas."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pypdf>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17"]

[project.scripts]
reflick = "reflick.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reflick"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
